name: Release

# Push a tag like v1.0.0 to publish a release:
#   git tag v1.0.0 && git push origin v1.0.0
# This builds the plugin, attaches the zip to a GitHub release and adds it to manifest.json,
# which is what makes it installable from Jellyfin's plugin catalogue.

on:
  push:
    tags: ["v*"]
  # Re-run for an existing tag (for example after fixing the workflow): Actions -> Release -> Run workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.0.0"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Work out the version
        id: ver
        run: |
          SHORT="${TAG#v}"
          if ! [[ "$SHORT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Tag must look like v1.2.3"; exit 1; fi
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "full=$SHORT.0" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test Jellyboxed.sln -c Release

      - name: Publish plugin
        run: dotnet publish Jellyfin.Plugin.Jellyboxed/Jellyfin.Plugin.Jellyboxed.csproj -c Release -o out -p:Version=${{ steps.ver.outputs.full }}

      - name: Start from the manifest on main (it holds all earlier releases)
        run: |
          git fetch origin main
          git show origin/main:manifest.json > manifest.json

      - name: Package and update manifest
        run: python3 scripts/package.py --dll out/Jellyfin.Plugin.Jellyboxed.dll --version ${{ steps.ver.outputs.full }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="dist/jellyboxed_${{ steps.ver.outputs.full }}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # The release was created by hand: keep its notes, just attach (or replace) the zip.
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --title "Jellyboxed ${{ steps.ver.outputs.short }}" \
              --notes-file <(python3 -c "import json;print(json.load(open('manifest.json'))[0]['versions'][0]['changelog'])")
          fi

      - name: Commit manifest to the default branch
        run: |
          cp manifest.json /tmp/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- manifest.json
          git checkout -B main origin/main
          cp /tmp/manifest.json manifest.json
          git add manifest.json
          git commit -m "chore: add ${TAG} to plugin manifest" || echo "nothing to commit"
          git push origin main
